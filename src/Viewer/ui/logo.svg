<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#561528"/>
      <stop offset="55%" stop-color="#3E111F"/>
      <stop offset="100%" stop-color="#2F131C"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7677F"/>
      <stop offset="100%" stop-color="#F03859"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87B8F"/>
      <stop offset="48%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="14" y="14" width="996" height="996" rx="222"/>
    </clipPath>
  </defs>

  <!-- Clipped Adobe CC x ArtCraft interior -->
  <g clip-path="url(#squircleClip)">
    <rect x="14" y="14" width="996" height="996" fill="url(#ccCore)"/>
    <rect x="14" y="14" width="996" height="996" fill="url(#ccWash)"/>
    <g>
      <line x1="208" y1="24" x2="208" y2="1000" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="208" x2="1000" y2="208" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="360" y1="24" x2="360" y2="1000" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="360" x2="1000" y2="360" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="512" y1="24" x2="512" y2="1000" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="512" x2="1000" y2="512" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="664" y1="24" x2="664" y2="1000" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="664" x2="1000" y2="664" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="816" y1="24" x2="816" y2="1000" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="816" x2="1000" y2="816" stroke="#FECDD3" stroke-opacity="0.045" stroke-width="2"/>
    </g>
    <!-- Crisp flat Adobe CC colored frame inside the squircle -->
    <rect x="28" y="28" width="968" height="968" rx="208"
          fill="none" stroke="url(#rimInk)" stroke-width="28"/>
    <!-- Fine drafted architectural inner hairline -->
    <rect x="44" y="44" width="936" height="936" rx="192"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <!-- Crisp ArtCraft drafted ink outer boundary (ensures razor-sharp contrast on #F2F1EE paper) -->
  <rect x="14" y="14" width="996" height="996" rx="222"
        fill="none" stroke="#101014" stroke-opacity="0.88" stroke-width="8"/>

  <!-- Harmonized architectural mini functional symbol cell (top-right) -->
  <g transform="translate(796, 216)">
    <rect x="-100" y="-100" width="200" height="200" rx="44"
          fill="#481223" stroke="#F43F5E" stroke-opacity="0.62" stroke-width="6"/>
    <rect x="-92" y="-92" width="184" height="184" rx="37"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2.5"/>
    <g transform="scale(1.28)">
      <rect x="-50" y="-36" width="100" height="72" rx="12" fill="none" stroke="#FECDD3" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-22" cy="-10" r="9" fill="#F43F5E"/>
        <path d="M-40 32 L-10 2 L12 22 L26 8 L44 32" fill="none" stroke="#FECDD3" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

