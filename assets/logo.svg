<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep obsidian dark interior -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="52%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>

    <!-- Signature ambient corner glow -->
    <radialGradient id="ambientBR" cx="82%" cy="86%" r="72%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#E11D48" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientTL" cx="18%" cy="12%" r="58%">
      <stop offset="0%" stop-color="#FECDD3" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing border gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3"/>
      <stop offset="45%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Luminous 2-letter monogram fill -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3"/>
      <stop offset="42%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Outer & inner rim neon glow -->
    <filter id="rimGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="40" y="40" width="944" height="944" rx="212"/>
    </clipPath>
  </defs>

  <!-- Soft outer neon halo -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="#F43F5E" stroke-width="34" stroke-opacity="0.42" filter="url(#rimGlow)"/>

  <!-- Clipped dark tile interior -->
  <g clip-path="url(#tileClip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bgGrad)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#ambientBR)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#ambientTL)"/>
    <!-- Subtle inner glass sheen -->
    <rect x="64" y="64" width="896" height="896" rx="190"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="4"/>
  </g>

  <!-- Crisp glowing colored border -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="url(#rimGrad)" stroke-width="26"/>
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="#FECDD3" stroke-opacity="0.55" stroke-width="5"/>

  <!-- Mini functional symbol badge (top-right) -->
  <g transform="translate(792, 218)">
    <rect x="-102" y="-102" width="204" height="204" rx="56"
          fill="#0C1018" fill-opacity="0.92" stroke="#F43F5E" stroke-opacity="0.52" stroke-width="6.5"/>
    <g transform="scale(1.30)">
      
        <rect x="-50" y="-36" width="100" height="72" rx="12" fill="none" stroke="#FECDD3" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-22" cy="-10" r="9" fill="#F43F5E"/>
        <path d="M-40 32 L-10 2 L12 22 L26 8 L44 32" fill="none" stroke="#FECDD3" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
        
    </g>
  </g>

  <!-- Prominent 2-letter Adobe-style monogram -->
  <g fill="url(#textGrad)" filter="url(#textShadow)">
      <path d="M420 -4Q406 -4 396.0 6.0Q386 16 386 30V1266H758V30Q758 16 748.0 6.0Q738 -4 725 -4ZM47 1094Q34 1094 25.0 1103.0Q16 1112 16 1125V1402Q16 1414 25.0 1423.0Q34 1432 47 1432H1097Q1110 1432 1119.0 1423.0Q1128 1414 1128 1402V1125Q1128 1112 1119.0 1103.0Q1110 1094 1097 1094Z" transform="translate(117.16,792.00) scale(0.30278,-0.30278)"/>
      <path d="M113 -3Q101 -3 92.0 6.0Q83 15 83 28V1405Q83 1418 91.5 1426.5Q100 1435 113 1435H385Q397 1435 406.0 1426.5Q415 1418 415 1405V897H418Q464 978 550.5 1025.0Q637 1072 746 1072Q913 1072 1010.5 970.5Q1108 869 1108 696V28Q1108 15 1099.0 6.0Q1090 -3 1077 -3H798Q786 -3 776.5 6.0Q767 15 767 28V606Q767 689 726.5 737.0Q686 785 606 785Q528 785 475.5 729.0Q423 673 423 584V28Q423 15 414.0 6.0Q405 -3 393 -3Z" transform="translate(451.41,792.00) scale(0.30278,-0.30278)"/>
  </g>
</svg>
